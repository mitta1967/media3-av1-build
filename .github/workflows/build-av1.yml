name: Build Media3 AV1 decoder

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Download Media3 1.9.0 sources
        uses: actions/checkout@v4
        with:
          repository: androidx/media
          ref: "1.9.0"
          path: media

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install native build tools
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ninja-build nasm python3-pip

          python3 -m pip install --user "meson==1.5.2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Android native tools
        run: |
          set -euo pipefail

          sdkmanager \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Fetch native library sources
        working-directory: media/libraries/decoder_av1/src/main/jni
        run: |
          set -euo pipefail

          git clone --depth 1 --branch v0.9.0 \
            https://github.com/google/cpu_features.git

          git clone --depth 1 --branch 1.5.1 \
            https://code.videolan.org/videolan/dav1d.git

      - name: Record source versions
        run: |
          set -euo pipefail

          mkdir -p artifacts

          {
            echo "Media3:"
            git -C media rev-parse HEAD

            echo
            echo "cpu_features:"
            git -C media/libraries/decoder_av1/src/main/jni/cpu_features \
              rev-parse HEAD

            echo
            echo "dav1d:"
            git -C media/libraries/decoder_av1/src/main/jni/dav1d \
              rev-parse HEAD
          } | tee artifacts/source-versions.txt

      - name: Fix ARM64 NEON detection in Media3 JNI
        working-directory: media/libraries/decoder_av1/src/main/jni
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          source = Path("dav1d_jni.cc")
          text = source.read_text(encoding="utf-8")

          old = "#if CPU_FEATURES_COMPILED_ANY_ARM_NEON"
          new = (
              "#if CPU_FEATURES_COMPILED_ANY_ARM_NEON || "
              "(defined(__aarch64__) && defined(__ARM_NEON))"
          )

          count = text.count(old)
          if count != 1:
              raise SystemExit(
                  f"Expected exactly one NEON condition, found {count}. "
                  "Patch aborted."
              )

          source.write_text(
              text.replace(old, new, 1),
              encoding="utf-8"
          )

          print("Patched ARM64 NEON detection:")
          for number, line in enumerate(
              source.read_text(encoding="utf-8").splitlines(), 1
          ):
              if "__aarch64__" in line:
                  print(f"{source}:{number}: {line}")
          PY

          git diff --check
          git diff -- dav1d_jni.cc

          git diff -- dav1d_jni.cc \
            > "$GITHUB_WORKSPACE/artifacts/arm64-neon.patch"

      - name: Build dav1d native libraries
        working-directory: media
        run: |
          set -euo pipefail

          export AV1_MODULE_PATH="$PWD/libraries/decoder_av1/src/main"
          export NDK_PATH="$ANDROID_HOME/ndk/27.0.12077973"
          export HOST_PLATFORM="linux-x86_64"

          cd "$AV1_MODULE_PATH/jni"
          chmod +x build_dav1d.sh

          ./build_dav1d.sh \
            "$AV1_MODULE_PATH" \
            "$NDK_PATH" \
            "$HOST_PLATFORM"

      - name: Build Media3 AV1 AAR
        working-directory: media
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            :lib-decoder-av1:assembleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Collect and inspect AV1 AAR
        run: |
          set -euo pipefail

          find media -type f \
            -name '*av1*release*.aar' \
            -exec cp {} artifacts/ \;

          count=$(find artifacts -maxdepth 1 -name '*.aar' | wc -l)

          if [ "$count" -eq 0 ]; then
            echo "AV1 AAR was not found."
            find media -type f -name '*.aar'
            exit 1
          fi

          for file in artifacts/*.aar; do
            echo "Inspecting: $file"

            listing=$(unzip -l "$file")
            printf '%s\n' "$listing"

            if ! grep -E 'jni/arm64-v8a/.*\.so' <<< "$listing"; then
              echo "ERROR: ARM64 native libraries are missing from $file"
              exit 1
            fi
          done

          sha256sum artifacts/*.aar | tee artifacts/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: media3-1.9.0-av1
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
